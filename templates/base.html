<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Forum</h1>
        <div class="links">
            <ol class="pages">
                <li>
                    <a href="/">Homepage</a>
                </li>
                <li>
                    <a href="/posts">Posts</a>
                </li>
                <li>
                    <a href="/create-post">Create Post</a>
                </li>
            </ol>
            <div class="account">
                {% if session.get("user") %}
                    <ol class="account_list pages">
                        <li class="account_name"> <a href="/user/{{ session.get('user') }}">{{ session.get("user") }}</a></li>
                        <li> 
                            <a href="/signout">Sign out</a>
                        </li>
                    </ol>
                {% else %}
                    <ol class="account_list pages">
                        <li>
                            <a href="/signup">Sign up</a>
                        </li>
                        <li>
                            <a href="/login">Log in</a>
                        </li>
                    </ol>
                {% endif %}
            </div>
        </div>
    </header>
    <hr>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>Please be nice in the Forum!<br>&#169 Jonathan
        </p>
    </footer>
</body>
</html>
