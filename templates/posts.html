{% extends "base.html" %}
{% block content %}
{% for post in posts %}
    <a class="post-wrapper" href="post/{{ post[2] }}">
        <div class="posts" {% if loop.index is even %} style="background-color: rgb(219, 219, 219);" {% endif %}>
            <h2 class="posts-title">{{ post[2] }}</h2>
            <img src="/static/profile_pictures/{{ post[6] }}">
            <p class="posts-user">Posted by: {{ post[1] }}</p>
            <p class="posts-time">
            Uploaded: {{ post[4].strftime("%Y-%m-%d %H:%M:%S") }} </p>
            {% if post[5] %}
                Last post: {{ post[5].strftime("%Y-%m-%d %H:%M:%S") }}
            {% endif %}
        </div>
    </a>
{% endfor %}
{% endblock %}
