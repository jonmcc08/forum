{% extends "base.html" %}
{% block content %}
<div class="edituser">
    <form method="post" enctype="multipart/form-data">
        Firstname: <input name="firstname" id="firstname" autocomplete="given-name" placeholder="{{ user[2] }}"> <br>
        Lastname: <input name="lastname" id="lastname" autocomplete="family-name" placeholder="{{ user[3] }}"> <br>
        Email: <input name="email" id="email" autocomplete="email" placeholder="{{ user[5] }}"><br><br>
        Username: <input name="username" id="username" autocomplete="username" minlength="3" maxlength="20" placeholder="{{ user[1] }}"> <br>
        Password: <input name="password" id="password" type="password" autocomplete="new-password"> <br>
        Profile Picture: <input name="picture" id="picture" type="file" accept="image/png, image/jpg, image/jpeg"> <br>
        <div id="picture-container">
            <img id="uploaded-file" src="/static/profile_pictures/{{ user[6] }}" alt="Picture of the user">
        </div>
        Old password (REQUIRED): <input name="oldpassword" required type="password"> <br>
        <input type="submit" id="submit">
    </form>
</div>
{% endblock %}
